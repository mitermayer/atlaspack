<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Test SVG with various elements -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient1)" />
  
  <!-- Test shapes -->
  <rect x="25" y="25" width="50" height="50" fill="white" opacity="0.8" />
  <polygon points="50,20 60,40 40,40" fill="black" />
  
  <!-- Text element -->
  <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="black">
    SVG Test
  </text>
</svg>